<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#243244;font-family:"Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
main{max-width:920px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #dce4ed;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 8px 24px #1f314610}

<script>
const lessons={"1": {"title": "おうちごはん", "theme": "食事", "questions": [{"number": 1, "topic": "くり（栗）", "type": "自由記述＋四択", "promptJp": "これは、<ruby>何<rt>なん</rt></ruby>ですか。", "promptEn": "What is this?", "images": [{"file": "lesson01_chestnut.jpg", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["くり", "栗"], "choices": [{"jp": "くり（栗）", "en": "chestnut"}, {"jp": "もも（桃）", "en": "peach"}, {"jp": "かき（柿）", "en": "persimmon"}, {"jp": "いちご（苺）", "en": "strawberry"}], "correct": 0, "explanationJp": "これは、くりです。くりは、<ruby>秋<rt>あき</rt></ruby>に<ruby>食<rt>た</rt></ruby>べることが<ruby>多<rt>おお</rt></ruby>い<ruby>木<rt>き</rt></ruby>の<ruby>実<rt>み</rt></ruby>です。", "explanationEn": "This is a chestnut. Chestnuts are nuts that are commonly eaten in autumn."}, {"number": 2, "topic": "お刺身", "type": "自由記述＋四択", "promptJp": "これは、<ruby>何<rt>なん</rt></ruby>ですか。", "promptEn": "What is this?", "images": [{"file": "lesson01_sashimi.jpg", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["お刺身", "刺身", "さしみ"], "choices": [{"jp": "お<ruby>刺身<rt>さしみ</rt></ruby>", "en": "sashimi; slices of raw fish"}, {"jp": "<ruby>天<rt>てん</rt></ruby>ぷら", "en": "tempura"}, {"jp": "<ruby>寿司<rt>すし</rt></ruby>", "en": "sushi"}, {"jp": "<ruby>冷<rt>ひ</rt></ruby>や<ruby>奴<rt>やっこ</rt></ruby>", "en": "chilled tofu"}], "correct": 0, "explanationJp": "これは、お<ruby>刺身<rt>さしみ</rt></ruby>です。お<ruby>刺身<rt>さしみ</rt></ruby>は、<ruby>魚<rt>さかな</rt></ruby>などを<ruby>生<rt>なま</rt></ruby>のまま<ruby>薄<rt>うす</rt></ruby>く<ruby>切<rt>き</rt></ruby>った<ruby>料理<rt>りょうり</rt></ruby>です。", "explanationEn": "This is sashimi. Sashimi is a dish made by thinly slicing raw fish or other seafood."}, {"number": 3, "topic": "ピーマン", "type": "画像選択", "promptJp": "ピーマンはどれですか。", "promptEn": "Which one is a green pepper?", "images": [{"file": "lesson01_peanut.jpg", "en": "peanut"}, {"file": "lesson01_lotus-root.jpg", "en": "lotus root"}, {"file": "lesson01_green-pepper.jpg", "en": "green pepper"}, {"file": "lesson01_pumpkin.jpg", "en": "pumpkin"}], "answers": [], "choices": [{"jp": "<ruby>落花生<rt>らっかせい</rt></ruby>", "en": "peanut"}, {"jp": "れんこん", "en": "lotus root"}, {"jp": "ピーマン", "en": "green pepper"}, {"jp": "かぼちゃ", "en": "pumpkin"}], "correct": 2, "explanationJp": "ピーマンは、<ruby>緑色<rt>みどりいろ</rt></ruby>の<ruby>野菜<rt>やさい</rt></ruby>です。<ruby>少<rt>すこ</rt></ruby>し<ruby>苦<rt>にが</rt></ruby>い<ruby>味<rt>あじ</rt></ruby>がします。", "explanationEn": "A green pepper is a green vegetable. It has a slightly bitter taste."}, {"number": 4, "topic": "ちくわ", "type": "画像選択", "promptJp": "「ちくわ」は、どれですか。", "promptEn": "Which one is chikuwa?", "images": [{"file": "lesson01_kamaboko.jpg", "en": "fish cake"}, {"file": "lesson01_chikuwa.jpg", "en": "tube-shaped fish cake"}, {"file": "lesson01_edamame.jpg", "en": "edamame"}, {"file": "lesson01_natto.jpg", "en": "natto; fermented soybeans"}], "answers": [], "choices": [{"jp": "かまぼこ", "en": "fish cake"}, {"jp": "ちくわ", "en": "tube-shaped fish cake"}, {"jp": "<ruby>枝豆<rt>えだまめ</rt></ruby>", "en": "edamame"}, {"jp": "<ruby>納豆<rt>なっとう</rt></ruby>", "en": "natto; fermented soybeans"}], "correct": 1, "explanationJp": "ちくわは、<ruby>魚<rt>さかな</rt></ruby>のすり<ruby>身<rt>み</rt></ruby>を<ruby>棒<rt>ぼう</rt></ruby>に<ruby>巻<rt>ま</rt></ruby>き、<ruby>焼<rt>や</rt></ruby>いたり<ruby>蒸<rt>む</rt></ruby>したりして<ruby>作<rt>つく</rt></ruby>ります。<ruby>真<rt>ま</rt></ruby>ん<ruby>中<rt>なか</rt></ruby>に<ruby>穴<rt>あな</rt></ruby>があります。", "explanationEn": "Chikuwa is made by wrapping fish paste around a stick and grilling or steaming it. It has a hole in the middle."}, {"number": 5, "topic": "小豆", "type": "自由記述＋四択", "promptJp": "「小豆」の<ruby>読<rt>よ</rt></ruby>み<ruby>方<rt>かた</rt></ruby>は、<ruby>何<rt>なん</rt></ruby>ですか。", "promptEn": "How do you read 小豆?", "images": [{"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["あずき"], "choices": [{"jp": "こまめ", "en": "frequent; diligent"}, {"jp": "とうふ", "en": "tofu"}, {"jp": "あずき", "en": "adzuki bean; red bean"}, {"jp": "なっとう", "en": "natto; fermented soybeans"}], "correct": 2, "explanationJp": "「小豆」は「あずき」と<ruby>読<rt>よ</rt></ruby>みます。<ruby>小豆<rt>あずき</rt></ruby>は、<ruby>赤<rt>あか</rt></ruby>くて<ruby>小<rt>ちい</rt></ruby>さい<ruby>豆<rt>まめ</rt></ruby>です。あんこや<ruby>赤飯<rt>せきはん</rt></ruby>などに<ruby>使<rt>つか</rt></ruby>います。", "explanationEn": "小豆 is read as azuki. Azuki beans are small red beans. They are used to make sweet bean paste and sekihan."}, {"number": 6, "topic": "目玉焼き", "type": "自由記述＋四択", "promptJp": "「<ruby>目玉焼<rt>めだまや</rt></ruby>き」は、<ruby>何<rt>なに</rt></ruby>で<ruby>作<rt>つく</rt></ruby>りますか。", "promptEn": "What is a fried egg made from?", "images": [{"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["卵", "たまご", "玉子"], "choices": [{"jp": "のり（海苔）", "en": "nori; dried seaweed"}, {"jp": "タコ", "en": "octopus"}, {"jp": "<ruby>卵<rt>たまご</rt></ruby>", "en": "egg"}, {"jp": "<ruby>魚<rt>さかな</rt></ruby>", "en": "fish"}], "correct": 2, "explanationJp": "<ruby>目玉焼<rt>めだまや</rt></ruby>きは、<ruby>卵<rt>たまご</rt></ruby>を<ruby>割<rt>わ</rt></ruby>って<ruby>焼<rt>や</rt></ruby>いた<ruby>料理<rt>りょうり</rt></ruby>です。<ruby>普通<rt>ふつう</rt></ruby>、<ruby>黄身<rt>きみ</rt></ruby>を<ruby>崩<rt>くず</rt></ruby>さないで<ruby>焼<rt>や</rt></ruby>きます。", "explanationEn": "A fried egg is made by cracking and frying an egg. Usually, the yolk is left unbroken while it cooks."}, {"number": 7, "topic": "味噌汁", "type": "自由記述＋四択", "promptJp": "「<ruby>味噌汁<rt>みそしる</rt></ruby>」は、<ruby>何<rt>なに</rt></ruby>に<ruby>入<rt>い</rt></ruby>れて<ruby>飲<rt>の</rt></ruby>みますか。", "promptEn": "What do you put miso soup in when you drink it?", "images": [{"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["お椀", "椀", "わん", "おわん"], "choices": [{"jp": "<ruby>急須<rt>きゅうす</rt></ruby>", "en": "teapot"}, {"jp": "お<ruby>椀<rt>わん</rt></ruby>", "en": "soup bowl"}, {"jp": "まな<ruby>板<rt>いた</rt></ruby>", "en": "cutting board"}, {"jp": "<ruby>湯飲<rt>ゆの</rt></ruby>み<ruby>茶碗<rt>ぢゃわん</rt></ruby>", "en": "teacup"}], "correct": 1, "explanationJp": "<ruby>味噌汁<rt>みそしる</rt></ruby>は、<ruby>普通<rt>ふつう</rt></ruby>、お<ruby>椀<rt>わん</rt></ruby>に<ruby>入<rt>い</rt></ruby>れて<ruby>飲<rt>の</rt></ruby>みます。<ruby>急須<rt>きゅうす</rt></ruby>はお<ruby>茶<rt>ちゃ</rt></ruby>をいれるときに<ruby>使<rt>つか</rt></ruby>います。", "explanationEn": "Miso soup is usually served and drunk from a soup bowl. A teapot is used to make tea."}, {"number": 8, "topic": "味噌", "type": "自由記述＋四択", "promptJp": "「<ruby>味噌<rt>みそ</rt></ruby>」は、大豆から<ruby>作<rt>つく</rt></ruby>ります。「大豆」の<ruby>読<rt>よ</rt></ruby>み<ruby>方<rt>かた</rt></ruby>は、どれですか。", "promptEn": "Miso is made from soybeans. How do you read 大豆?", "images": [{"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["だいず"], "choices": [{"jp": "あずき", "en": "adzuki bean; red bean"}, {"jp": "だいず", "en": "soybean"}, {"jp": "おおまめ", "en": "large bean"}, {"jp": "だいこん", "en": "daikon radish"}], "correct": 1, "explanationJp": "「大豆」は「だいず」と<ruby>読<rt>よ</rt></ruby>みます。<ruby>大豆<rt>だいず</rt></ruby>は、<ruby>味噌<rt>みそ</rt></ruby>、しょうゆ、<ruby>豆腐<rt>とうふ</rt></ruby>などを<ruby>作<rt>つく</rt></ruby>るときに<ruby>使<rt>つか</rt></ruby>います。", "explanationEn": "大豆 is read as daizu. Soybeans are used to make foods and seasonings such as miso, soy sauce, and tofu."}]}, "2": {"title": "花よりだんご", "theme": "植物・和菓子", "questions": [{"number": 9, "topic": "アジサイ", "type": "画像選択", "promptJp": "「アジサイ」の<ruby>花<rt>はな</rt></ruby>は、どれですか。", "promptEn": "Which flower is a hydrangea?", "images": [{"file": "lesson02_hydrangea.jpg", "en": "hydrangea"}, {"file": "lesson02_cosmos.jpg", "en": "cosmos"}, {"file": "lesson02_tulip.jpg", "en": "tulip"}, {"file": "lesson02_dandelion.jpg", "en": "dandelion"}], "answers": [], "choices": [{"jp": "アジサイ", "en": "hydrangea"}, {"jp": "コスモス", "en": "cosmos"}, {"jp": "チューリップ", "en": "tulip"}, {"jp": "タンポポ", "en": "dandelion"}], "correct": 0, "explanationJp": "アジサイは、<ruby>梅雨<rt>つゆ</rt></ruby>のころによく<ruby>咲<rt>さ</rt></ruby>く<ruby>花<rt>はな</rt></ruby>です。<ruby>青<rt>あお</rt></ruby>、<ruby>紫<rt>むらさき</rt></ruby>、ピンクなど、いろいろな<ruby>色<rt>いろ</rt></ruby>があります。", "explanationEn": "Hydrangeas often bloom during the rainy season. They come in various colors, including blue, purple, and pink."}, {"number": 10, "topic": "かしわ餅", "type": "画像選択", "promptJp": "「かしわ<ruby>餅<rt>もち</rt></ruby>」は、どれですか。", "promptEn": "Which one is kashiwa mochi?", "images": [{"file": "lesson02_ohagi.jpg", "en": "sweet rice ball"}, {"file": "lesson02_dango.jpg", "en": "rice dumpling"}, {"file": "lesson02_kashiwa-mochi.jpg", "en": "rice cake filled with sweet bean paste in an oak leaf"}, {"file": "lesson02_monaka.jpg", "en": "wafer cake filled with sweet bean paste"}], "answers": [], "choices": [{"jp": "おはぎ", "en": "sweet rice ball"}, {"jp": "だんご", "en": "rice dumpling"}, {"jp": "かしわ<ruby>餅<rt>もち</rt></ruby>", "en": "rice cake filled with sweet bean paste in an oak leaf"}, {"jp": "もなか", "en": "wafer cake filled with sweet bean paste"}], "correct": 2, "explanationJp": "かしわ<ruby>餅<rt>もち</rt></ruby>は、あんこが<ruby>入<rt>はい</rt></ruby>った<ruby>餅<rt>もち</rt></ruby>を、かしわの<ruby>葉<rt>は</rt></ruby>で<ruby>包<rt>つつ</rt></ruby>んだ<ruby>和菓子<rt>わがし</rt></ruby>です。<ruby>子<rt>こ</rt></ruby>どもの<ruby>日<rt>ひ</rt></ruby>によく<ruby>食<rt>た</rt></ruby>べます。", "explanationEn": "Kashiwa mochi is a Japanese sweet made by wrapping a rice cake filled with sweet bean paste in an oak leaf. It is commonly eaten on Children's Day."}, {"number": 11, "topic": "たい焼き", "type": "四択", "promptJp": "「たい<ruby>焼<rt>や</rt></ruby>き」は、<ruby>何<rt>なん</rt></ruby>ですか。", "promptEn": "What is taiyaki?", "images": [{"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": [], "choices": [{"jp": "<ruby>茶碗<rt>ちゃわん</rt></ruby>", "en": "rice bowl"}, {"jp": "<ruby>焼<rt>や</rt></ruby>き<ruby>魚<rt>ざかな</rt></ruby>", "en": "grilled fish"}, {"jp": "レシピ", "en": "recipe"}, {"jp": "お<ruby>菓子<rt>かし</rt></ruby>", "en": "sweet; snack"}], "correct": 3, "explanationJp": "たい<ruby> 四択", "promptJp": "<ruby>折<rt>お</rt></ruby>り<ruby>紙<rt>がみ</rt></ruby>で<ruby>作<rt>つく</rt></ruby>りました。これは、<ruby>何<rt>なん</rt></ruby>ですか。", "promptEn": "This was made with origami. What is it?", "images": [{"file": "lesson06_origami-crane.jpg", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["ツル", "鶴", "つる"], "choices": [{"jp": "<ruby>飛行機<rt>ひこうき</rt></ruby>", "en": "airplane"}, {"jp": "ハト（鳩）", "en": "pigeon; dove"}, {"jp": "ツル（鶴）", "en": "crane"}, {"jp": "カラス（烏）", "en": "crow"}], "correct": 2, "explanationJp": "これは、<ruby>折<rt>お</rt></ruby>り<ruby>紙<rt>がみ</rt></ruby>で<ruby>作<rt>つく</rt></ruby>った<ruby>鶴<rt>つる</rt></ruby>です。<ruby>鶴<rt>つる</rt></ruby>は、<ruby>長寿<rt>ちょうじゅ</rt></ruby>や<ruby>平和<rt>へいわ</rt></ruby>を<ruby>表<rt>あらわ</rt></ruby>すものとして<ruby>知<rt>し</rt></ruby>られています。", "explanationEn": "This is an origami crane. Cranes are known as symbols of longevity and peace."}, {"number": 42, "topic": "じゃんけん", "type": "自由記述＋四択", "promptJp": "「じゃんけん」をしています。これは、<ruby>何<rt>なん</rt></ruby>ですか。", "promptEn": "They are playing rock-paper-scissors. Which hand shape is this?", "images": [{"file": "lesson06_janken-scissors.jpg", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["チョキ"], "choices": [{"jp": "ピース", "en": "peace sign"}, {"jp": "パー", "en": "paper"}, {"jp": "チョキ", "en": "scissors"}, {"jp": "グー", "en": "rock"}], "correct": 2, "explanationJp": "これは、じゃんけんの「チョキ」です。<ruby>人差<rt>ひとさ</rt></ruby>し<ruby>指<rt>ゆび</rt></ruby>と<ruby>中指<rt>なかゆび</rt></ruby>を<ruby>出<rt>だ</rt></ruby>した<ruby>形<rt>かたち</rt></ruby>で、じゃんけんでは「パー」に<ruby>勝<rt>か</rt></ruby>ちます。", "explanationEn": "This is scissors in rock-paper-scissors. It is made by extending the index and middle fingers, and it beats paper."}, {"number": 43, "topic": "ふとん", "type": "四択", "promptJp": "<ruby>寝<rt>ね</rt></ruby>るときに<ruby>使<rt>つか</rt></ruby>う<ruby>物<rt>もの</rt></ruby>は、<ruby>何<rt>なん</rt></ruby>ですか。", "promptEn": "Which item is used for sleeping?", "images": [{"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": [], "choices": [{"jp": "たんす", "en": "chest of drawers"}, {"jp": "ちゃぶ<ruby>台<rt>だい</rt></ruby>", "en": "low dining table"}, {"jp": "ふとん", "en": "futon bedding"}, {"jp": "そろばん", "en": "abacus"}], "correct": 2, "explanationJp": "ふとんは、<ruby>寝<rt>ね</rt></ruby>るときに<ruby>使<rt>つか</rt></ruby>う<ruby>寝具<rt>しんぐ</rt></ruby>です。<ruby>床<rt>ゆか</rt></ruby>や<ruby>畳<rt>たたみ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>に<ruby>敷<rt>し</rt></ruby>いて<ruby>使<rt>つか</rt></ruby>います。", "explanationEn": "Futon is bedding used for sleeping. It is spread on the floor or tatami mats."}, {"number": 44, "topic": "そろばん", "type": "四択", "promptJp": "<ruby>計算<rt>けいさん</rt></ruby>する<ruby>道具<rt>どうぐ</rt></ruby>を<ruby>何<rt>なん</rt></ruby>と<ruby>言<rt>い</rt></ruby>いますか。", "promptEn": "What is the tool used for calculation called?", "images": [{"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": [], "choices": [{"jp": "かんばん", "en": "signboard"}, {"jp": "とうばん", "en": "person on duty"}, {"jp": "るすばん", "en": "looking after a house while others are away"}, {"jp": "そろばん", "en": "abacus"}], "correct": 3, "explanationJp": "そろばんは、<ruby>珠<rt>たま</rt></ruby>を<ruby>動<rt>うご</rt></ruby>かして<ruby>計算<rt>けいさん</rt></ruby>する<ruby>道具<rt>どうぐ</rt></ruby>です。<ruby>足<rt>た</rt></ruby>し<ruby>算<rt>ざん</rt></ruby>や<ruby>引<rt>ひ</rt></ruby>き<ruby>算<rt>ざん</rt></ruby>などに<ruby>使<rt>つか</rt></ruby>います。", "explanationEn": "A soroban is a tool used for calculation by moving beads. It is used for operations such as addition and subtraction."}, {"number": 45, "topic": "けん玉", "type": "自由記述＋四択", "promptJp": "<ruby>何<rt>なに</rt></ruby>をして、<ruby>遊<rt>あそ</rt></ruby>んでいますか。", "promptEn": "What are they playing with?", "images": [{"file": "lesson06_kendama.jpg", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["けん玉", "けんだま", "剣玉"], "choices": [{"jp": "すごろく", "en": "sugoroku board game"}, {"jp": "けん<ruby>玉<rt>だま</rt></ruby>", "en": "kendama"}, {"jp": "お<ruby>手玉<rt>てだま</rt></ruby>", "en": "beanbag juggling"}, {"jp": "ままごと", "en": "playing house"}], "correct": 1, "explanationJp": "けん<ruby>玉<rt>だま</rt></ruby>で<ruby>遊<rt>あそ</rt></ruby>んでいます。けん<ruby>玉<rt>だま</rt></ruby>は、ひもでつながった<ruby>玉<rt>たま</rt></ruby>を<ruby>皿<rt>さら</rt></ruby>や<ruby>先端<rt>せんたん</rt></ruby>にのせて<ruby>遊<rt>あそ</rt></ruby>ぶ<ruby>道具<rt>どうぐ</rt></ruby>です。", "explanationEn": "They are playing with a kendama. A kendama is a toy in which a ball attached by a string is caught on cups or a spike."}, {"number": 46, "topic": "日直", "type": "自由記述＋四択", "promptJp": "<ruby>学校<rt>がっこう</rt></ruby>のクラスの<ruby>中<rt>なか</rt></ruby>で、その<ruby>日<rt>ひ</rt></ruby>のいろいろなことをする<ruby>係<rt>かかり</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>を<ruby>何<rt>なん</rt></ruby>と<ruby>言<rt>い</rt></ruby>いますか。", "promptEn": "What do you call the student responsible for various classroom duties for the day?", "images": [{"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["日直", "にっちょく"], "choices": [{"jp": "<ruby>日直<rt>にっちょく</rt></ruby>", "en": "student on classroom duty"}, {"jp": "<ruby>日記<rt>にっき</rt></ruby>", "en": "diary"}, {"jp": "<ruby>垂直<rt>すいちょく</rt></ruby>", "en": "vertical; perpendicular"}, {"jp": "<ruby>正直<rt>しょうじき</rt></ruby>", "en": "honest; honesty"}], "correct": 0, "explanationJp": "<ruby>日直<rt>にっちょく</rt></ruby>は、クラスでその<ruby>日<rt>ひ</rt></ruby>の<ruby>仕事<rt>しごと</rt></ruby>を<ruby>担当<rt>たんとう</rt></ruby>する<ruby>人<rt>ひと</rt></ruby>です。<ruby>号令<rt>ごうれい</rt></ruby>をかけたり、<ruby>連絡<rt>れんらく</rt></ruby>をしたりします。", "explanationEn": "Nichoku is the student responsible for the day's classroom duties, such as leading greetings and making announcements."}, {"number": 47, "topic": "給食", "type": "自由記述＋四択", "promptJp": "<ruby>学校<rt>がっこう</rt></ruby>で<ruby>食<rt>た</rt></ruby>べるお<ruby>昼<rt>ひる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>何<rt>なん</rt></ruby>と<ruby>言<rt>い</rt></ruby>いますか。", "promptEn": "What is the lunch served at school called?", "images": [{"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}, {"file": "", "en": ""}], "answers": ["給食", "きゅうしょく"], "choices": [{"jp": "<ruby>日食<rt>にっしょく</rt></ruby>", "en": "solar eclipse"}, {"jp": "<ruby>間食<rt>かんしょく</rt></ruby>", "en": "snack between meals"}, {"jp": "<ruby>給食<rt>きゅうしょく</rt></ruby>", "en": "school lunch"}, {"jp": "<ruby>外食<rt>がいしょく</rt></ruby>", "en": "eating out"}], "correct": 2, "explanationJp": "<ruby>給食<rt>きゅうしょく</rt></ruby>は、<ruby>学校<rt>がっこう</rt></ruby>で<ruby>児童<rt>じどう</rt></ruby>や<ruby>生徒<rt>せいと</rt></ruby>が<ruby>食<rt>た</rt></ruby>べる<ruby>昼食<rt>ちゅうしょく</rt></ruby>です。<ruby>栄養<rt>えいよう</rt></ruby>のバランスを<ruby>考<rt>かんが</rt></ruby>えて<ruby>作<rt>つく</rt></ruby>られています。", "explanationEn": "Kyushoku is lunch served to pupils and students at school. It is prepared with nutritional balance in mind."}]}};
const RESULT_ENDPOINT="https://script.google.com/macros/s/AKfycbxzazk6qWYpSFGCDvbyb9VjvSxxIhlE4eC_OB7TIykVQbiK53fwlN_COQSK_4vYk1KQpQ/exec";
let nickname=localStorage.getItem("jc_nickname")||"";
let lid=null,qi=0,stage=1,selected=-1,results=[],order=[];
const app=document.getElementById("app");
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const norm=s=>String(s||"").trim().replace(/[。！!、,\s]/g,"");
function nameScreen(){app.innerHTML=`<div class="card"><h2>名前を入力してください</h2><p class="small">本名でなく、ニックネームでもかまいません。</p><div class="name-row"><input id="nameInput" maxlength="40" placeholder="名前・ニックネーム"><button id="saveName">保存して進む</button></div></div>`;nameInput.value=nickname;saveName.onclick=()=>{let v=nameInput.value.trim();if(!v)return alert("名前・ニックネームを入力してください。");nickname=v;localStorage.setItem("jc_nickname",v);home()}}
function changeName(){nickname="";localStorage.removeItem("jc_nickname");nameScreen()}
function home(){if(!nickname)return nameScreen();app.innerHTML=`<div class="card"><strong>名前：</strong>${nickname} <button class="secondary" onclick="changeName()">名前を変更</button></div><div class="card"><div class="grid">${Object.keys(lessons).map(Number).sort((a,b)=>a-b).map(id=>`<div class="item"><h2>第${id}課　${lessons[id].title}</h2><p>―${lessons[id].theme}―</p><button onclick="menu(${id})">開く</button></div>`).join("")}</div></div>`}
function menu(id){lid=id;app.innerHTML=`<button class="secondary" onclick="home()">← 課一覧</button><div class="card"><h2>第${id}課　${lessons[id].title}</h2><p>${lessons[id].questions.length}問を復習します。</p><button onclick="start()">基礎編を始める</button></div>`}
function start(){qi=0;stage=1;results=[];prepare();render()}function prepare(){order=shuffle([0,1,2,3]);selected=-1}
function totalStages(q){return q.type==="四択"?3:5}
function prog(){let q=lessons[lid].questions[qi];return `<div class="progress"><div style="width:${((qi+1)/lessons[lid].questions.length)*100}%"></div></div><p class="small">問題 ${qi+1} / ${lessons[lid].questions.length}　段階 ${stage} / ${totalStages(q)}</p>`}
function img(file){return file?`<img src="images/${file}" alt="">`:""}
function singleImage(q){return q.images&&q.images[0]&&q.images[0].file?`<div class="pic">${img(q.images[0].file)}</div>`:""}
function tchoices(q,n){return order.map((i,p)=>`<label class="choice"><input type="radio" name="${n}" value="${i}"> ${String.fromCharCode(65+p)}．${q.choices[i].jp}</label>`).join("")}
function ichoices(q,n,en){return `<div class="imggrid">${order.map(i=>`<label class="imgchoice"><input hidden type="radio" name="${n}" value="${i}">${img(q.images[i].file)}${en?`<div class="label">${q.images[i].en}</div>`:""}</label>`).join("")}</div>`}
function active(n){document.querySelectorAll(`input[name="${n}"]`).forEach(x=>x.onchange=()=>{document.querySelectorAll(".imgchoice").forEach(y=>y.classList.remove("selected"));x.closest(".imgchoice").classList.add("selected")})}
function finish(mark){let q=lessons[lid].questions[qi];results.push({number:q.number,topic:q.topic,result:mark});qi++;stage=1;if(qi>=lessons[lid].questions.length)return resultScreen();prepare();render()}
function reaction(mark){app.innerHTML=`${prog()}<div class="card"><div class="reaction">🎉<br><strong>正解です！</strong><br><span class="small">よくできました。</span></div><div class="actions"><button onclick="finish('${mark}')">次の問題へ</button></div></div>`}
function explanation(q,nextStage){let p=document.getElementById("p");p.innerHTML=`<h2>解説を読みましょう</h2><div class="feedback ${selected===q.correct?"ok":"bad"}">${selected===q.correct?"正解ですが、自信が十分ではありませんでした。":`正解は「${q.choices[q.correct].jp}」です。`}</div><div class="exp"><div>${q.explanationJp}</div><div class="en"><strong>English</strong><br><span id="e"></span></div></div><button id="go">もう一度答える</button>`;document.getElementById("e").textContent=q.explanationEn;document.getElementById("go").onclick=()=>{stage=nextStage;render()}}
function renderFourChoice(q){let p=document.getElementById("p");if(stage===1){p.innerHTML=`<h2>① 四択で答えましょう</h2><div class="question">${q.promptJp}</div>${singleImage(q)}${tchoices(q,"f1")}<h3>この答えに自信がありますか。</h3><label class="choice"><input type="radio" name="fc" value="ある"> 自信がある</label><label class="choice"><input type="radio" name="fc" value="ない"> あまり自信がない</label><button id="go">決定</button>`;document.getElementById("go").onclick=()=>{let a=document.querySelector('input[name="f1"]:checked'),c=document.querySelector('input[name="fc"]:checked');if(!a||!c)return alert("答えと自信を選んでください。");selected=Number(a.value);if(selected===q.correct&&c.value==="ある")reaction("○");else{stage=2;render()}}}else if(stage===2){explanation(q,3)}else{p.innerHTML=`<h2>③ もう一度答えましょう</h2><div class="question">${q.promptJp}</div><div class="en"><span id="pe"></span></div>${singleImage(q)}${tchoices(q,"f3")}<button id="go">答える</button>`;document.getElementById("pe").textContent=q.promptEn;document.getElementById("go").onclick=()=>{let a=document.querySelector('input[name="f3"]:checked');if(!a)return alert("答えを選んでください。");Number(a.value)===q.correct?reaction("△"):finish("★")}}}
function render(){let q=lessons[lid].questions[qi],isImg=q.type==="画像選択";app.innerHTML=`<button class="secondary" onclick="menu(${lid})">← メニュー</button>${prog()}<div class="card" id="p"></div>`;let p=document.getElementById("p");if(q.type==="四択")return renderFourChoice(q);
if(stage===1){p.innerHTML=`<h2>① ヒントなしで答えましょう</h2><div class="question">${q.promptJp}</div>${isImg?ichoices(q,"a1",false):`${q.images[0].file?`<div class="pic">${img(q.images[0].file)}</div>`:""}<input id="free">`}<button id="go">答える</button>`;if(isImg)active("a1");document.getElementById("go").onclick=()=>{let ok=isImg?Number(document.querySelector('input[name="a1"]:checked')?.value)===q.correct:q.answers.some(a=>norm(a)===norm(document.getElementById("free").value));ok?reaction("◎"):(stage=2,render())}}
else if(stage===2){p.innerHTML=`<h2>② 四択で答えましょう</h2><div class="question">${q.promptJp}</div>${isImg?ichoices(q,"a2",true):`${singleImage(q)}${tchoices(q,"a2")}`}<h3>この答えに自信がありますか。</h3><label class="choice"><input type="radio" name="c" value="ある"> 自信がある</label><label class="choice"><input type="radio" name="c" value="ない"> あまり自信がない</label><button id="go">決定</button>`;if(isImg)active("a2");document.getElementById("go").onclick=()=>{let a=document.querySelector('input[name="a2"]:checked'),c=document.querySelector('input[name="c"]:checked');if(!a||!c)return alert("答えと自信を選んでください。");selected=Number(a.value);if(selected===q.correct&&c.value==="ある")reaction("○");else{stage=3;render()}}}
else if(stage===3){explanation(q,4)}
else if(stage===4){p.innerHTML=`<h2>④ もう一度答えましょう</h2><div class="question">${q.promptJp}</div><div class="en"><span id="pe"></span></div>${isImg?ichoices(q,"a4",false):`${q.images[0].file?`<div class="pic">${img(q.images[0].file)}</div>`:""}<input id="free4">`}<button id="go">答える</button>`;document.getElementById("pe").textContent=q.promptEn;if(isImg)active("a4");document.getElementById("go").onclick=()=>{let ok=isImg?Number(document.querySelector('input[name="a4"]:checked')?.value)===q.correct:q.answers.some(a=>norm(a)===norm(document.getElementById("free4").value));ok?reaction("△"):(stage=5,render())}}
else{p.innerHTML=`<h2>⑤ 最後の確認</h2><div class="question">${q.promptJp}</div><div class="en"><span id="pe"></span></div>${isImg?ichoices(q,"a5",true):`${singleImage(q)}${tchoices(q,"a5")}`}<button id="go">答える</button>`;document.getElementById("pe").textContent=q.promptEn;if(isImg)active("a5");document.getElementById("go").onclick=()=>{let a=document.querySelector('input[name="a5"]:checked');if(!a)return alert("答えを選んでください。");Number(a.value)===q.correct?reaction("▲"):finish("★")}}}
function counts(){let c={excellent:0,good:0,reviewed:0,finalCorrect:0,incorrect:0};results.forEach(x=>{if(x.result==="◎")c.excellent++;else if(x.result==="○")c.good++;else if(x.result==="△")c.reviewed++;else if(x.result==="▲")c.finalCorrect++;else c.incorrect++});return c}
async function sendResults(){let b=document.getElementById("send"),m=document.getElementById("msg");b.disabled=true;b.textContent="送信中…";try{await fetch(RESULT_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({nickname,lessonNumber:lid,lessonName:lessons[lid].title,counts:counts(),details:results})});b.textContent="送信済み";m.className="send-status send-ok";m.textContent="結果を送信しました。"}
catch(err){b.disabled=false;b.textContent="結果を送信";m.className="send-status send-bad";m.textContent="送信できませんでした。"}}
function resultScreen(){let c=counts();app.innerHTML=`<div class="card"><h2>第${lid}課 基礎編を完了しました</h2><p><strong>名前：</strong>${nickname}</p><p>◎ ${c.excellent}　○ ${c.good}　△ ${c.reviewed}　▲ ${c.finalCorrect}　★ ${c.incorrect}</p>${results.map(x=>`<p><strong>${x.result}</strong>　${x.number}：${x.topic}</p>`).join("")}<div class="actions"><button id="send" onclick="sendResults()">結果を送信</button><button class="secondary" onclick="menu(${lid})">メニューへ戻る</button></div><div id="msg"></div></div>`}
home();
</script></body></html>
